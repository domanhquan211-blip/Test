# .github/workflows/main.yml

name: Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Validate
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Compile Swift file (standalone check)
        run: |
          swiftc \
            -sdk $(xcrun --sdk iphonesimulator --show-sdk-path) \
            -target arm64-apple-ios15.0-simulator \
            -module-name LordexSwipePatch \
            Sources/LordexSwipePatch.swift \
            -o /tmp/LordexSwipePatch.o
        continue-on-error: false

      - name: Build Xcode project (if exists)
        if: ${{ hashFiles('*.xcodeproj') != '' }}
        run: |
          xcodebuild \
            -scheme "LordexSwipePatch" \
            -destination "platform=iOS Simulator,name=iPhone 15,OS=latest" \
            -configuration Debug \
            build \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Run tests (if scheme has tests)
        if: ${{ hashFiles('*.xcodeproj') != '' }}
        run: |
          xcodebuild \
            -scheme "LordexSwipePatch" \
            -destination "platform=iOS Simulator,name=iPhone 15,OS=latest" \
            -configuration Debug \
            test \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
        continue-on-error: true
