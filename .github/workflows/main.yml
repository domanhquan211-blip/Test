# .github/workflows/main.yml
name: Build

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    name: Build & Validate
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2   # ← bump lên v4.2.2 (Node.js 24)

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Compile Swift file
        run: |
          swiftc \
            -sdk $(xcrun --sdk iphonesimulator --show-sdk-path) \
            -target arm64-apple-ios15.0-simulator \
            -module-name NewOffset \
            Test/NewOffset.swift \
            -o /tmp/NewOffset.o
        continue-on-error: false

      - name: Build Xcode project (if exists)
        if: ${{ hashFiles('*.xcodeproj') != '' }}
        run: |
          xcodebuild \
            -scheme "LordexSwipePatch" \
            -destination "platform=iOS Simulator,name=iPhone 15,OS=latest" \
            -configuration Debug \
            build \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Run tests
        if: ${{ hashFiles('*.xcodeproj') != '' }}
        run: |
          xcodebuild \
            -scheme "NewOffset" \
            -destination "platform=iOS Simulator,name=iPhone xs,OS=latest" \
            -configuration Debug \
            test \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
        continue-on-error: true
